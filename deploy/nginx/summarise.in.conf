# -----------------------------------------------------------------------------
# Summarise Corporate — Nginx server block for www.summarise.in
# -----------------------------------------------------------------------------
# Drop this at /etc/nginx/sites-available/SUMMARISE-WEBSITE then enable via
# symlink to sites-enabled and reload nginx. Full runbook: deploy/DEPLOY.md
#
# Handles everything the old .htaccess did on the Apache-style host:
#   - Clean URLs           /about       → /about/index.php
#                          /faqs        → /faqs.php
#                          /services/x  → /services/x.php
#   - Apex → www redirect  summarise.in → www.summarise.in
#   - Custom 404           /404.php
#   - Security headers     X-Content-Type-Options, X-Frame-Options,
#                          Referrer-Policy, Permissions-Policy
#   - Gzip compression     text/css, text/js, svg, xml, json
#   - Static asset caching CSS/JS 30d, images 90d, fonts 1y
#   - Deny /includes/      server-side templates, never public
#   - Deny dot-files       .git, .env, .htaccess, etc.
# -----------------------------------------------------------------------------

# Apex → www redirect (needs to be a separate server block in nginx)
server {
    listen      80;
    listen [::]:80;
    server_name summarise.in;
    return 301  http://www.summarise.in$request_uri;
}

# Main server
server {
    listen      80;
    listen [::]:80;
    server_name www.summarise.in;

    root  /home/deploy/static-sites/SUMMARISE-WEBSITE;
    index index.php index.html;

    # === Compression ===================================================
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   5;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # === Security headers (match the old .htaccess) ====================
    add_header X-Content-Type-Options  "nosniff"                     always;
    add_header X-Frame-Options         "SAMEORIGIN"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    # HSTS: enable after Certbot / HTTPS is in place (uncomment below):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # === Custom 404 ====================================================
    error_page 404 /404.php;

    # === Deny server-side templates and dot-files ======================
    location ^~ /includes/ { deny all; return 404; }
    location ~ /\.         { deny all; return 404; }

    # === Static asset caching ==========================================
    # CSS / JS — 30 days, must-revalidate so redeploys propagate
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # Images / SVG — 90 days
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fonts — 1 year
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PDF, sitemap, robots — moderate cache
    location ~* \.(pdf|xml|txt)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # === Clean URLs ====================================================
    #
    # try_files order:
    #   1. Exact file at $uri  (e.g. /assets/css/style.css)
    #   2. Directory at $uri/  (falls through to index index.php → e.g. /about/ → /about/index.php)
    #   3. .php version         (e.g. /about/team → /about/team.php)
    #   4. 404
    #
    location / {
        try_files $uri $uri/ $uri.php =404;
    }

    # === PHP handler ===================================================
    #
    # Runs .php files through PHP-FPM. If you upgrade PHP later, change
    # ONLY the socket path below and reload nginx:
    #   PHP 7.4  →  unix:/var/run/php/php7.4-fpm.sock
    #   PHP 8.0  →  unix:/var/run/php/php8.0-fpm.sock
    #   PHP 8.1  →  unix:/var/run/php/php8.1-fpm.sock
    #   PHP 8.2  →  unix:/var/run/php/php8.2-fpm.sock
    #
    location ~ \.php$ {
        include       snippets/fastcgi-php.conf;
        fastcgi_pass  unix:/var/run/php/php7.2-fpm.sock;
    }
}
